name: Build Nyxian IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create missing config file
      run: |
        if [ ! -f "Nyxian/PrivateConfig.xcconfig" ]; then
          echo "// Auto-generated placeholder for CI" > Nyxian/PrivateConfig.xcconfig
        fi

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Build and Archive (Safe Mode)
      run: |
        mkdir -p build
        set -o pipefail && \
        xcodebuild \
          -project Nyxian.xcodeproj \
          -scheme Nyxian \
          -sdk iphoneos \
          -configuration Release \
          SWIFT_COMPILATION_MODE=wholemodule \
          SWIFT_OPTIMIZATION_LEVEL='-O' \
          SWIFT_DISABLE_SWIFTUI_PREVIEWS=YES \
          ENABLE_PREVIEWS=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO \
          clean archive \
          -archivePath build/Nyxian.xcarchive | tee build/build.log

    - name: Export Unsigned IPA
      run: |
        cat > ExportOptions.plist <<EOF
        {
          "method": "development",
          "signingStyle": "manual",
          "compileBitcode": false,
          "stripSwiftSymbols": true,
          "signingCertificate": "Apple Development"
        }
        EOF
        xcodebuild -exportArchive \
          -archivePath build/Nyxian.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist || true

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Nyxian-IPA
        path: build/*.ipa
